[project]
name = "hms_tz"
authors = [
    { name = "Aakvatech", email = "['EMAIL_ADDRESS']" }
]
description = "Hms Tz"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "PyPDF2",
    "requests",
    "python-dateutil",
    "numpy",
    "pandas",
    "pypika",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
dev = [
    "pre-commit",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "B",
]
ignore = [
  "E501",
  "E402",
  "E741",
]
